[project]
name = "magstrel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shainilps", email = "shainilps.work@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
magstrel = "magstrel.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
