<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}magstrel{% endblock %}</title>
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --card: #ffffff; --accent: #2563eb; --tag: #f5f5f4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --card: #292524; --accent: #60a5fa; --tag: #3a3532; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
    header h1 { margin: 0; font-size: 22px; }
    header h1 a { color: var(--fg); }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    .tag { display: inline-block; background: var(--tag); border-radius: 999px; padding: 1px 10px; margin: 2px 4px 2px 0; font-size: 13px; }
    input, select, button { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
    button { background: var(--accent); color: white; border: none; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 13px; color: var(--muted); font-weight: 600; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1><a href="/">magstrel</a></h1>
      <span class="muted">your own job database</span>
    </header>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
